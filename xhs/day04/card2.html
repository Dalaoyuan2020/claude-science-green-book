<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1440px;overflow:hidden}
body{font-family:"PingFang SC",sans-serif;background:#F2F7F3;color:#1B2620;padding:72px 56px;display:flex;flex-direction:column}
.tag{display:inline-block;background:#215E41;color:#fff;font-weight:800;font-size:30px;padding:10px 26px;border-radius:100px;align-self:flex-start}

.imgbox img{width:100%;display:block;object-fit:cover}
.price{margin-top:32px;display:flex;gap:20px}
.pcard{flex:1;background:#fff;border:2px solid #E1EAE3;border-radius:20px;padding:30px 26px;text-align:center}
.pcard .t{font-size:29px;color:#5F7A6B;font-weight:700}
.pcard .v{font-size:58px;font-weight:900;color:#1E7A4C;margin-top:8px;line-height:1}
.pcard .v small{font-size:30px;color:#8AA394;font-weight:700}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding-top:30px}
.foot .tip{font-size:30px;color:#5F7A6B;font-weight:600}
.foot .tip b{color:#1E7A4C}
.sign{font-size:28px;color:#8AA394}
</style></head><body>
