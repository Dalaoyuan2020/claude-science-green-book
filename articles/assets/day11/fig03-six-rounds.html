<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1600px;background:#FFFFFF;font-family:"PingFang SC",sans-serif}
.card{width:1600px;box-sizing:border-box;padding:64px 64px 40px;background:#FFFFFF}
h1{font-family:"Yuanti SC","PingFang SC",sans-serif;font-size:44px;font-weight:700;color:#2E6B4B;margin:0 0 6px}
.sub{font-size:26px;color:#6B7C72;margin:0 0 30px}
.blocks{display:flex;align-items:stretch;gap:22px}
.blk{flex:1;min-width:0;border-radius:16px;padding:24px 24px 20px;position:relative}
.blk.b1{background:#E8F2EC}
.blk.b2{background:#C9DCD1}
.blk.b3{background:#2E6B4B}
.blk .bt{font-size:30px;font-weight:700;font-family:"Yuanti SC","PingFang SC",sans-serif;margin-bottom:16px}
.b1 .bt{color:#2E6B4B}.b2 .bt{color:#2E6B4B}.b3 .bt{color:#fff}
.tag{position:absolute;top:-18px;left:22px;background:#2E6B4B;color:#fff;font-size:20px;font-weight:700;padding:5px 14px;border-radius:8px}
.round{background:#fff;border:2px solid #C9DCD1;border-radius:12px;padding:13px 16px;margin-bottom:10px;font-size:22px;color:#2B2B2B;line-height:1.4}
.round b{color:#2E6B4B}
.b3 .round{border-color:#2E6B4B}
.out{margin-top:8px;font-size:20px;line-height:1.4;padding:10px 14px;border-radius:10px;background:rgba(255,255,255,.55)}
.b1 .out,.b2 .out{color:#2E6B4B}
.b3 .out{background:rgba(255,255,255,.16);color:#E8F2EC}
.out .ol{font-weight:700;font-size:18px;display:block;margin-bottom:3px}
.arr{display:flex;align-items:center;color:#2E6B4B;font-size:44px;font-weight:900}
</style></head><body>
<div class="card">
  <h1>六轮提问的三段</h1>
  <p class="sub">先勘察 · 再设计 · 后验收 —— 前两轮不动笔</p>
  <div class="blocks">
    <div class="blk b1">
      <span class="tag">AI 不动笔</span>
      <div class="bt">勘察 · 第 1–2 轮</div>
      <div class="round"><b>第 1 轮</b>　我讲，它记</div>
      <div class="round"><b>第 2 轮</b>　它追问 + 实搜文献体量</div>
      <div class="out"><span class="ol">产出</span>候选领域与实测条数</div>
    </div>
    <div class="arr">→</div>
    <div class="blk b2">
      <div class="bt">设计 · 第 3–4 轮</div>
      <div class="round"><b>第 3 轮</b>　定科学问题 + 分三层</div>
      <div class="round"><b>第 4 轮</b>　流程表 + 工具表 + 分工</div>
      <div class="out"><span class="ol">产出</span>一套能讲清楚的技术路线</div>
    </div>
    <div class="arr">→</div>
    <div class="blk b3">
      <div class="bt">验收 · 第 5–6 轮</div>
      <div class="round"><b>第 5 轮</b>　四条红线逐条过</div>
      <div class="round"><b>第 6 轮</b>　待补充清单</div>
      <div class="out"><span class="ol">产出</span>能直接填进模板的内容</div>
    </div>
  </div>
</div>
</body></html>
