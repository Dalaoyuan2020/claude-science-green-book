<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1600px;background:#FFFFFF;font-family:"PingFang SC",sans-serif}
.card{width:1600px;box-sizing:border-box;padding:64px 64px 40px;background:#FFFFFF}
h1{font-family:"Yuanti SC","PingFang SC",sans-serif;font-size:44px;font-weight:700;color:#2E6B4B;margin:0 0 6px}
.sub{font-size:26px;color:#6B7C72;margin:0 0 34px}
.track{display:flex;gap:0;align-items:stretch;position:relative}
.seg{box-sizing:border-box;border-radius:14px;padding:20px 22px;background:#E8F2EC;border:2px solid #C9DCD1;margin-right:14px;display:flex;flex-direction:column;justify-content:flex-start}
.seg .nm{font-size:26px;font-weight:700;color:#2E6B4B;font-family:"Yuanti SC","PingFang SC",sans-serif;white-space:nowrap}
.seg .tm{font-size:38px;font-weight:900;color:#2B2B2B;margin:8px 0 6px;white-space:nowrap}
.seg .ok{font-size:18px;color:#6B7C72;line-height:1.45}
.seg:last-child{margin-right:0}
.s1{width:44%}
.s2{width:14%}
.s3{width:14%}
.s4{width:28%}
.loop{margin-top:18px;display:flex;align-items:center;font-size:20px;color:#B37400}
.loop .ic{font-size:38px;color:#2E6B4B;font-weight:900;margin-right:12px}
.side{margin-top:26px;background:#F2F2F2;border-radius:12px;padding:16px 22px;font-size:22px;color:#2B2B2B}
.side b{color:#2E6B4B}
</style></head><body>
<div class="card">
  <h1>30 分钟动线</h1>
  <p class="sub">四步的时间、产出和过关标准 · 格子的宽度就是时间的长短</p>
  <div class="track">
    <div class="seg s1"><div class="nm">六轮提问</div><div class="tm">15 分钟</div><div class="ok">六轮都确认过，红线全绿</div></div>
    <div class="seg s2"><div class="nm">填模板</div><div class="tm">3 分钟</div><div class="ok">正文 3000–5000 字</div></div>
    <div class="seg s3"><div class="nm">模拟评分</div><div class="tm">3 分钟</div><div class="ok">拿到打分报告</div></div>
    <div class="seg s4"><div class="nm">照着报告改</div><div class="tm">10 分钟</div><div class="ok">红线零警告，弱项清单在变短</div></div>
  </div>
  <div class="loop"><span class="ic">↺</span><span>停在：连着两轮没新增红线警告、弱项清单不再缩短（「照着报告改」回到「模拟评分」）</span></div>
  <div class="side"><b>提交前两份清单 20 分钟</b> · 不算在 30 分钟里：一份查隐私（密钥、联系方式只走官方报名表），一份查那三个坑</div>
</div>
</body></html>
