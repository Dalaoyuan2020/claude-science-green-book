<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1600px;background:#FFFFFF;font-family:"PingFang SC",sans-serif}
.card{width:1600px;box-sizing:border-box;padding:64px 64px 40px;background:#FFFFFF}
h1{font-family:"Yuanti SC","PingFang SC",sans-serif;font-size:44px;font-weight:700;color:#2E6B4B;margin:0 0 6px}
.sub{font-size:26px;color:#6B7C72;margin:0 0 30px}
.cols{display:flex;gap:20px}
.col{flex:1;min-width:0;border:2px solid #C9DCD1;border-radius:14px;overflow:hidden}
.col .hd{background:#2E6B4B;color:#fff;font-size:28px;font-weight:700;font-family:"Yuanti SC","PingFang SC",sans-serif;padding:16px 20px;text-align:center}
.col .bd{padding:18px 22px;font-size:23px;color:#2B2B2B;line-height:1.6}
.col .bd p{margin:0 0 14px}
.foot{margin-top:28px;background:#2E6B4B;color:#fff;text-align:center;font-size:30px;font-weight:700;font-family:"Yuanti SC","PingFang SC",sans-serif;padding:16px;border-radius:12px}
</style></head><body>
<div class="card">
  <h1>一张图看完</h1>
  <p class="sub">比赛要什么 · 包里有什么 · 30 分钟怎么走</p>
  <div class="cols">
    <div class="col">
      <div class="hd">比赛要什么</div>
      <div class="bd">
        <p>文献调研智能体：检索筛选、知识抽取、缺口识别、证据链报告</p>
        <p>四条红线，编造引用直接出局</p>
        <p>初赛交三件，这一篇只管第三件</p>
        <p>官方模板，正文 3000–5000 字</p>
      </div>
    </div>
    <div class="col">
      <div class="hd">包给什么</div>
      <div class="bd">
        <p>背景卡、提示词、官方模板、评价指标、六轮提问法</p>
        <p>两个技能：开始 baseline、评分</p>
        <p>一个脚本：自动填官方模板</p>
        <p>一套示例：只看结构，数字全是编的</p>
      </div>
    </div>
    <div class="col">
      <div class="hd">30 分钟怎么走</div>
      <div class="bd">
        <p>15 分钟回答六轮提问</p>
        <p>3 分钟填进模板</p>
        <p>3 分钟模拟评分</p>
        <p>10 分钟照着报告改</p>
      </div>
    </div>
  </div>
  <div class="foot">模板给的是容器，内容得自己提供</div>
</div>
</body></html>
