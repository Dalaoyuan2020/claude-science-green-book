<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;width:1000px;height:640px;overflow:hidden;}
  body{font-family:"PingFang SC","Hiragino Sans GB",sans-serif;background:#F2F7F3;}
  .wrap{width:1000px;height:640px;padding:36px 40px;box-sizing:border-box;display:flex;flex-direction:column;gap:20px;}
  h1{margin:0;text-align:center;font-size:34px;color:#215E41;font-family:"Songti SC",serif;}
  .panels{flex:1;display:flex;gap:24px;}
  .panel{flex:1;border-radius:16px;padding:26px 28px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;}
  .left{background:#FFFFFF;border:2px solid #D9E3DA;}
  .right{background:#215E41;color:#fff;}
  .tag{font-size:22px;font-weight:700;}
  .left .tag{color:#75857B;}
  .big{font-size:30px;font-weight:800;line-height:1.3;}
  .left .big{color:#1B2620;}
  .item{font-size:20px;line-height:1.5;display:flex;gap:10px;align-items:baseline;}
  .left .item{color:#47584F;}
  .right .item{color:#E2F1E7;}
  .mk{font-weight:800;}
  .left .mk{color:#A8473D;}
  .right .mk{color:#8FE0B4;}
  .foot{font-size:18px;color:#75857B;text-align:center;}
  .bubble{background:#F2F7F3;border-radius:10px;padding:10px 14px;font-size:17px;color:#47584F;}
  .right .bubble{background:rgba(255,255,255,.12);color:#E2F1E7;}
</style></head><body>
<div class="wrap">
  <h1>聊天框 vs Claude Science</h1>
  <div class="panels">
    <div class="panel left">
      <div class="tag">💬 聊天框</div>
      <div class="big">帮你想</div>
      <div class="bubble">"这个方向的文献嘛，主要有以下几类……（一大段很有道理的话）"</div>
      <div class="item"><span class="mk">✗</span>复制粘贴，你自己来</div>
      <div class="item"><span class="mk">✗</span>存档整理，你自己来</div>
      <div class="item"><span class="mk">✗</span>做表统计，你自己来</div>
      <div class="item"><span class="mk">✗</span>聊完关掉，啥也没留下</div>
    </div>
    <div class="panel right">
      <div class="tag">🤖 Claude Science</div>
      <div class="big">帮你做</div>
      <div class="bubble">"查完了。48 篇已分成 7 派，报告在你桌面上。"</div>
      <div class="item"><span class="mk">✓</span>真的去查学术数据库</div>
      <div class="item"><span class="mk">✓</span>查完自动存成文件</div>
      <div class="item"><span class="mk">✓</span>自己统计、自己排报告</div>
      <div class="item"><span class="mk">✓</span>你只管：提要求，读结论</div>
    </div>
  </div>
  <div class="foot">一个是很会聊天的军师，一个是撸起袖子干活的搭档</div>
</div>
</body></html>
