<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1024px;height:1024px;overflow:hidden}
body{font-family:"Yuanti SC","PingFang SC",sans-serif;background:radial-gradient(120% 90% at 50% 0%,#2F7A50 0%,#1A5033 46%,#0C2A1B 100%)}
.wrap{height:1024px;padding:70px 64px 60px;display:flex;flex-direction:column;align-items:center;text-align:center}
.eyebrow{display:inline-flex;align-items:center;gap:14px;color:#8FD4AC;font-family:"PingFang SC",sans-serif;font-size:27px;font-weight:800;letter-spacing:6px}
.eyebrow .ln{width:44px;height:2px;background:rgba(143,212,172,.55);border-radius:2px}
.en{margin-top:30px;color:#fff;font-size:78px;font-weight:900;line-height:1;letter-spacing:.01em}
.zh{color:#fff;font-size:150px;font-weight:900;line-height:1.12;letter-spacing:.06em;text-shadow:0 6px 30px rgba(0,0,0,.35)}
.day{margin-top:8px;color:#FFE07A;font-size:58px;font-weight:900;letter-spacing:.03em}
.dsub{color:#CFE7D7;font-family:"PingFang SC",sans-serif;font-size:27px;font-weight:600;letter-spacing:2px;margin-top:12px}
/* console art */
.art{margin-top:46px;width:900px;height:388px;background:linear-gradient(160deg,#12331F,#0B2416);border:1.5px solid rgba(143,212,172,.28);border-radius:30px;box-shadow:0 24px 60px rgba(0,0,0,.4);padding:30px 34px;display:flex;flex-direction:column;text-align:left}
.bar{display:flex;align-items:center;gap:14px}
.dots{display:flex;gap:9px}
.dots i{width:15px;height:15px;border-radius:50%;display:block}
.dots .r{background:#F0857D}.dots .y{background:#F2C94C}.dots .g{background:#7FD39B}
.bt{margin-left:8px;font-family:"PingFang SC",sans-serif;font-size:22px;font-weight:700;color:#9FC7AF;letter-spacing:1px}
.toggles{margin-left:auto;display:flex;gap:12px}
.pill{display:flex;align-items:center;gap:9px;background:rgba(143,212,172,.14);border:1px solid rgba(143,212,172,.34);border-radius:100px;padding:8px 16px;font-family:"PingFang SC",sans-serif;font-size:21px;font-weight:700;color:#DFF3E6}
.pill .sw{width:30px;height:17px;border-radius:100px;background:#8FD4AC;position:relative}
.pill .sw::after{content:"";position:absolute;right:2px;top:2px;width:13px;height:13px;border-radius:50%;background:#0B2416}
.mid{margin-top:26px;display:flex;align-items:center;gap:14px}
.agent{display:inline-flex;align-items:center;gap:12px;background:rgba(233,198,63,.14);border:1px solid rgba(233,198,63,.4);border-radius:12px;padding:12px 20px;font-family:"PingFang SC",sans-serif;font-size:23px;font-weight:800;color:#FFE07A}
.agent .d{width:12px;height:12px;border-radius:50%;background:#FFE07A;box-shadow:0 0 0 6px rgba(255,224,122,.18)}
.chip{background:rgba(143,212,172,.12);border:1px solid rgba(143,212,172,.3);border-radius:12px;padding:12px 20px;font-family:"PingFang SC",sans-serif;font-size:23px;font-weight:700;color:#CFE7D7}
.lines{margin-top:24px;display:flex;flex-direction:column;gap:14px}
.lines span{height:14px;border-radius:8px;background:linear-gradient(90deg,rgba(143,212,172,.32),rgba(143,212,172,.08))}
.lines .l1{width:82%}.lines .l2{width:64%}.lines .l3{width:73%}
</style></head><body><div class="wrap">
<div class="eyebrow"><span class="ln"></span>第二部 · 真正上手<span class="ln"></span></div>
<div class="en">Claude Science</div>
<div class="zh">绿皮书</div>
<div class="day">05 · 界面篇</div>
<div class="dsub">打开软件，把它调成你的科研工作台</div>
<div class="art">
  <div class="bar">
    <span class="dots"><i class="r"></i><i class="y"></i><i class="g"></i></span>
    <span class="bt">Claude Science</span>
    <span class="toggles">
      <span class="pill"><span class="sw"></span>Notebook</span>
      <span class="pill"><span class="sw"></span>Auto-review</span>
    </span>
  </div>
  <div class="mid">
    <span class="agent"><span class="d"></span>2 active subagents</span>
    <span class="chip">Memory · on</span>
    <span class="chip">Compute · Local</span>
  </div>
  <div class="lines"><span class="l1"></span><span class="l2"></span><span class="l3"></span></div>
</div>
</div></body></html>
