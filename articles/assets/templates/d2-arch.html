<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1000px;height:640px;overflow:hidden}
body{font-family:"PingFang SC",sans-serif;background:#F2F7F3}
.wrap{padding:36px 48px;box-sizing:border-box;height:640px;display:flex;flex-direction:column;gap:16px}
h1{margin:0;text-align:center;font-size:30px;color:#215E41;font-family:"Songti SC",serif}
.cols{display:flex;gap:18px;flex:1}
.col{flex:1;border-radius:14px;padding:22px 26px;box-sizing:border-box;display:flex;flex-direction:column;gap:13px}
.left{background:#F7E9E6;border:2px solid #E3C4BE}
.right{background:#215E41;color:#fff}
.col h2{margin:0 0 4px;font-size:22px}
.left h2{color:#A8473D}
.row{display:grid;grid-template-columns:34px 1fr;gap:6px;font-size:19px;line-height:1.5;align-items:baseline}
.row.wide{grid-template-columns:96px 1fr}
.left .row{color:#6B4A44}
.right .row{color:#E2F1E7}
.row b{white-space:nowrap}
.right .row b{color:#8FE0B4}
.flow{background:#fff;border:2px solid #D9E3DA;border-radius:12px;padding:13px 18px;text-align:center;font-size:19px;color:#1B2620;font-weight:600}
.flow span{color:#1E7A4C}
</style></head><body><div class="wrap">
<h1>四座山，CSA 替你翻</h1>
<div class="cols">
<div class="col left"><h2>😩 拦住你的四座山</h2>
<div class="row"><b>①</b><span>先过 WSL2、Ubuntu、端口转发三关</span></div>
<div class="row"><b>②</b><span>各家平台的接口协议各说各话</span></div>
<div class="row"><b>③</b><span>模型名对不上：sonnet ↔ glm-5.2</span></div>
<div class="row"><b>④</b><span>API Key 要保存、切换、测试、防泄漏</span></div></div>
<div class="col right"><h2>🤖 CSA 的三件套</h2>
<div class="row wide"><b>启动器</b><span>双击面板：体检、加 Key、启动</span></div>
<div class="row wide"><b>运行管家</b><span>在 WSL 里替你养好 Linux 环境</span></div>
<div class="row wide"><b>翻译官</b><span>翻译请求给上游模型，<br>模型名自动映射</span></div>
<div class="row wide"><b>顺手的</b><span>Key 本地系统级加密，<br>第三方接口先确认再发</span></div></div>
</div>
<div class="flow">上手四步：<span>下载解压 → 交 AI 按 skill 装 → 加 Key → 测试启动</span>　·　难活都在你看不见的地方</div>
</div></body></html>
