<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;overflow:hidden}
body{font-family:"PingFang SC",sans-serif;background:linear-gradient(160deg,#F2F7F3,#E4EFE7);padding:44px 44px 40px}
.head{display:flex;align-items:center;gap:16px;margin-bottom:8px}
.head .badge{background:#215E41;color:#fff;font-size:24px;font-weight:800;padding:8px 22px;border-radius:100px}
.head .t{font-size:34px;font-weight:900;color:#1A4531}
.sub{font-size:22px;color:#5F7A6B;margin:0 0 28px 2px;font-weight:500}
.grid{display:flex;gap:26px;align-items:stretch}
.card{flex:1;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,.12);border:1px solid #DCE6DE;display:flex;flex-direction:column}
.card .cap{padding:16px 22px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #EEF3EF}
.card .cap .dot{width:12px;height:12px;border-radius:50%;background:#1E7A4C;flex:none}
.card .cap .ct{font-size:23px;font-weight:800;color:#1A4531}
.card .cap .cm{font-size:19px;color:#8AA394;font-weight:600;margin-left:auto}
.imgwrap{flex:1;background:#fff;display:flex;align-items:center;justify-content:center;padding:10px}
.imgwrap img{width:100%;height:100%;object-fit:contain;display:block}
.card.a .imgwrap{height:560px}
.card.b .imgwrap{height:560px}
.foot{margin-top:26px;text-align:center}
.foot .pill{display:inline-block;background:#215E41;color:#fff;font-size:23px;font-weight:700;padding:12px 30px;border-radius:100px}
.foot .pill b{color:#FFE07A}
</style></head><body>

  <div class="card a">
    <div class="cap"><span class="dot"></span><span class="ct">酶动力学建模</span><span class="cm">R² = 0.9925</span></div>
    <div class="imgwrap"><img src="file:///Users/minilyu/Documents/Claude_Mini_agent/claude-science-green-book/articles/assets/day04/src-enzyme.png"></div>
  </div>
  <div class="card b">
    <div class="cap"><span class="dot"></span><span class="ct">20 篇文献综述</span><span class="cm">检索＋四联图＋报告</span></div>
    <div class="imgwrap"><img src="file:///Users/minilyu/Documents/Claude_Mini_agent/claude-science-green-book/articles/assets/day04/src-organoid.png"></div>
  </div>
</div>
