<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:820px;overflow:hidden}
body{font-family:"PingFang SC",sans-serif;background:linear-gradient(160deg,#2E6B4B,#10301F);color:#fff;padding:56px 60px;display:flex;flex-direction:column}
.top{text-align:center}
.top .ey{font-size:24px;font-weight:700;letter-spacing:4px;color:#8FD4AC}
.top h2{font-family:"Yuanti SC","PingFang SC",sans-serif;font-size:56px;font-weight:900;margin-top:14px;letter-spacing:2px}
.chain{display:flex;align-items:stretch;justify-content:center;gap:0;margin-top:46px}
.item{width:250px;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.30);border-radius:22px;padding:32px 22px;text-align:center;display:flex;flex-direction:column;align-items:center}
.item .ic{font-size:72px;line-height:1}
.item .n{font-size:26px;font-weight:900;margin-top:16px;white-space:nowrap}
.item .d{font-size:21px;color:#CFE3D6;margin-top:10px;line-height:1.4;font-weight:500}
.item .ok{margin-top:16px;font-size:20px;font-weight:800;color:#0E2C1D;background:#8FD4AC;border-radius:100px;padding:5px 20px}
.plus{display:flex;align-items:center;justify-content:center;font-size:46px;color:#8FD4AC;font-weight:300;width:48px}
.you{width:250px;background:linear-gradient(160deg,#E9C63F,#D9A82C);border-radius:22px;padding:32px 22px;text-align:center;display:flex;flex-direction:column;align-items:center;box-shadow:0 12px 36px rgba(233,198,63,.35)}
.you .ic{font-size:72px;line-height:1}
.you .n{font-size:30px;font-weight:900;margin-top:16px;color:#1A3A24}
.you .d{font-size:21px;margin-top:10px;line-height:1.4;font-weight:700;color:#3A2E08}
.you .ok{margin-top:16px;font-size:20px;font-weight:800;color:#fff;background:#1A4531;border-radius:100px;padding:5px 20px}
.foot{margin-top:auto;text-align:center}
.foot .big{font-family:"Yuanti SC","PingFang SC",sans-serif;font-size:44px;font-weight:900;letter-spacing:2px}
.foot .big .hl{color:#FFE07A}
</style></head><body>
<div class="top">
  <p class="ey">GREEN BOOK · 前四天，把路铺全了</p>
  <h2>该到位的，都到位了</h2>
</div>
<div class="chain">
  <div class="item"><span class="ic">💻</span><span class="n">Windows 电脑</span><span class="d">你手边这台<br>就够了</span><span class="ok">✓ 有了</span></div>
  <div class="plus">＋</div>
  <div class="item"><span class="ic">🤖</span><span class="n">我们的软件</span><span class="d">CSA<br>双击就开</span><span class="ok">✓ 有了</span></div>
  <div class="plus">＋</div>
  <div class="item"><span class="ic">🎫</span><span class="n">便宜的订阅</span><span class="d">OpenCode Go<br>一天一块二</span><span class="ok">✓ 有了</span></div>
  <div class="plus">＝</div>
  <div class="you"><span class="ic">🙋</span><span class="n">就差你了</span><span class="d">动手，<br>开跑</span><span class="ok">→ 该你了</span></div>
</div>
<div class="foot">
  <p class="big">工具都递到手里了，<span class="hl">剩下的，是你的科研</span></p>
</div>
</body></html>
