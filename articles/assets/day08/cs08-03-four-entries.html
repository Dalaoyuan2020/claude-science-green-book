<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1165px;height:240px;overflow:hidden;background:#fff;font-family:"PingFang SC",sans-serif}
.stage{position:relative;width:1165px;height:240px}
.band{position:absolute;left:0;top:0;width:1165px;height:109px}
.dot{position:absolute;width:34px;height:34px;border-radius:50%;background:#EA580C;color:#fff;font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px #fff,0 2px 8px rgba(0,0,0,.25)}
.lab{position:absolute;top:150px;font-size:20px;color:#1f2937;font-weight:600}
.lab b{color:#EA580C}
.note{position:absolute;top:196px;font-size:17px;color:#6b7280}
</style></head><body><div class="stage">
<img class="band" src="src/cs08-03-band.png">
<!-- markers: 1=版本号(v2) 2=⋮菜单 3=点开大图 -->
<div class="dot" style="left:221px;top:0px">1</div>
<div class="dot" style="left:998px;top:0px">2</div>
<div class="dot" style="left:1034px;top:0px">3</div>
<div class="lab" style="left:30px"><b>1</b> 版本号 <span style="color:#9ca3af">v2</span></div>
<div class="lab" style="left:430px"><b>2</b> ⋮ 更多菜单</div>
<div class="lab" style="left:760px"><b>3</b> 点开大图</div>
<div class="note" style="left:30px">收藏 Star、View in context、Copy link 都收在 ⋮ 菜单里（共 9 项），不是与 ⋮ 并列的按钮</div>
</div></body></html>
