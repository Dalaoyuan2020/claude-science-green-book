<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;overflow:hidden}
body{background:#F2F9F5;font-family:"PingFang SC",sans-serif;padding:56px 60px 60px}
.head{text-align:center;margin-bottom:14px}
.kick{display:inline-block;font-size:24px;font-weight:800;color:#0E5237;background:#C7ECD8;border-radius:100px;padding:7px 24px;letter-spacing:2px}
.title{font-family:"Yuanti SC","PingFang SC",sans-serif;font-size:60px;font-weight:900;color:#134E36;margin-top:18px;letter-spacing:1px}
.sub{font-size:27px;color:#5B7A6B;margin-top:8px}
.rows{margin-top:40px;display:flex;flex-direction:column;gap:0}
.row{display:flex;align-items:center;gap:26px;background:#fff;border:2px solid #DCEBE2;border-left:10px solid var(--c);border-radius:20px;padding:28px 32px;box-shadow:0 8px 22px rgba(19,78,54,.06)}
.n{flex:none;width:74px;height:74px;border-radius:20px;background:var(--c);color:#fff;font-size:40px;font-weight:900;display:flex;align-items:center;justify-content:center}
.tx{flex:1}
.tx .t{font-size:38px;font-weight:900;color:#173F2E}
.tx .t b{color:var(--c)}
.tx .d{font-size:26px;color:#5B7A6B;margin-top:4px}
.emoji{font-size:46px}
.arrow{text-align:center;color:#9FC3AE;font-size:34px;font-weight:900;line-height:1;margin:6px 0}
.foot{margin-top:36px;background:linear-gradient(135deg,#1E9160,#136343);border-radius:20px;padding:28px 34px;color:#fff}
.foot .l{font-size:22px;font-weight:800;letter-spacing:2px;opacity:.85}
.foot .p{font-size:31px;font-weight:800;margin-top:8px;line-height:1.5}
.foot .p b{color:#FFE07A}
.sign{text-align:right;color:#8AA99A;font-size:24px;margin-top:20px}
</style></head><body>
<div class="head">
  <span class="kick">一张图记住整个界面</span>
  <div class="title">由外到里，四层就够了</div>
  <div class="sub">认准这四层，你就不会在界面里迷路</div>
</div>
<div class="rows">
  <div class="row" style="--c:#37A76F"><span class="n">1</span><span class="emoji">🏠</span><div class="tx"><div class="t">最外层 · <b>主页挑项目</b></div><div class="d">Projects 项目库 ＋ Recent sessions 最近会话</div></div></div>
  <div class="arrow">↓</div>
  <div class="row" style="--c:#1E9160"><span class="n">2</span><span class="emoji">🗂</span><div class="tx"><div class="t">三栏 · <b>干活收货</b></div><div class="d">左边挑事情 · 中间干活 · 右边收成品</div></div></div>
  <div class="arrow">↓</div>
  <div class="row" style="--c:#147A52"><span class="n">3</span><span class="emoji">🎛</span><div class="tx"><div class="t">功能菜单 · <b>调方式</b></div><div class="d">围着底部输入框的 7 个开关（不在顶部）</div></div></div>
  <div class="arrow">↓</div>
  <div class="row" style="--c:#0F6647"><span class="n">4</span><span class="emoji">🔧</span><div class="tx"><div class="t">设置中心 · <b>深配置</b></div><div class="d">技能 / 连接器 / 权限 / 存储…（下一章讲透）</div></div></div>
</div>
<div class="foot">
  <div class="l">一句带走</div>
  <div class="p">先把 <b>Auto-review</b> 和 <b>Memory</b> 打开，你就站在一个靠谱的起点上了。</div>
</div>
<div class="sign">Claude Science 绿皮书 · 第二部 上手篇 · @河小驴</div>
</body></html>
