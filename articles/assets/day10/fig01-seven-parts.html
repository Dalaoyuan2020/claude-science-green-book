<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1000px;background:#F2F7F3;font-family:"PingFang SC",sans-serif}
.card{width:1000px;box-sizing:border-box;padding:44px 52px 26px;background:#F2F7F3}
h1{font-family:"Songti SC",serif;font-size:30px;font-weight:700;color:#215E41;margin:0 0 4px}
.sub{font-size:16px;color:#5b6b60;margin:0 0 26px}
.cols{display:flex;gap:18px}
.col{flex:1;min-width:0}
.ct{font-size:17.5px;font-weight:700;margin:0 0 4px;font-family:"Songti SC",serif}
.ct.a{color:#215E41}.ct.b{color:#B37400}.ct.c{color:#8a6d3b}
.csub{font-size:13.5px;color:#8a958c;margin:0 0 15px}
.cell{background:#fff;border:1.5px solid #dbe7de;border-radius:10px;padding:12px 15px;margin-bottom:11px}
.cell .nm{font-size:16px;font-weight:700;color:#263326;font-family:"Songti SC",serif;margin-bottom:3px}
.cell .ds{font-size:13.5px;color:#5b6b60;line-height:1.45}
.a .cell{border-left:4px solid #215E41}
.b .cell{border-left:4px solid #E9C63F}
.c .cell{border-left:4px solid #cbb26a;background:#FDFAF2}
.foot{margin-top:20px;text-align:right;font-size:14.5px;color:#8a958c}
</style></head><body>
<div class="card">
  <h1>七个部分，对照实验报告</h1>
  <p class="sub">实验报告里有没有现成的，分三档</p>

  <div class="cols">
    <div class="col a">
      <p class="ct a">一格 · 要整理</p>
      <p class="csub">报告里有，收拢成条就行</p>
      <div class="cell"><div class="nm">材料与方法</div><div class="ds">划分 json、参数配置实验时就记下了，从日志里挑出来收成条</div></div>
    </div>
    <div class="col b">
      <p class="ct b">两格 · 要转化</p>
      <p class="csub">数都在，但得换目标重排</p>
      <div class="cell"><div class="nm">结果与讨论</div><div class="ds">数现成，按这一篇要讲的重点重新排过</div></div>
      <div class="cell"><div class="nm">结论</div><div class="ds">报告结尾那两句是记录，换成站得住的判断</div></div>
    </div>
    <div class="col c">
      <p class="ct c">四格 · 得手搓</p>
      <p class="csub">报告里根本没有，从零写</p>
      <div class="cell"><div class="nm">标题</div><div class="ds">报告只有个文件名，全文定下来才总结得出</div></div>
      <div class="cell"><div class="nm">摘要</div><div class="ds">报告给自己人看，不需要这个东西</div></div>
      <div class="cell"><div class="nm">引言</div><div class="ds">实验里长不出来，得去读文献才写得出来</div></div>
      <div class="cell"><div class="nm">参考文献</div><div class="ds">报告里不引文献，要从头查、从头建</div></div>
    </div>
  </div>

  <div class="foot">据本篇实验素材整理 · 2026-08-03</div>
</div>
</body></html>
