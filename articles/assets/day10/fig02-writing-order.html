<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1000px;background:#F2F7F3;font-family:"PingFang SC",sans-serif}
.card{width:1000px;box-sizing:border-box;padding:44px 56px 28px;background:#F2F7F3}
h1{font-family:"Songti SC",serif;font-size:30px;font-weight:700;color:#215E41;margin:0 0 4px}
.sub{font-size:16px;color:#5b6b60;margin:0 0 30px}
.cols{display:flex;gap:40px}
.col{flex:1;min-width:0}
.ct{font-size:17px;font-weight:700;color:#215E41;margin:0 0 18px;font-family:"Songti SC",serif}
.step{background:#fff;border:1.5px solid #dbe7de;border-radius:10px;padding:12px 16px;margin-bottom:0;display:flex;align-items:center}
.step .n{flex:none;width:30px;height:30px;border-radius:50%;background:#215E41;color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;margin-right:12px}
.step .nm{font-size:17px;color:#263326;font-weight:600;font-family:"Songti SC",serif}
.vdown{width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-top:12px solid #b9c8bd;margin:6px 0 6px 26px}
.rd{background:#fff;border:1.5px dashed #cfe0d4;border-radius:10px;padding:12px 16px;margin-bottom:10px;font-size:17px;color:#3a463d;font-family:"Songti SC",serif}
.rd b{color:#215E41;font-weight:700}
.note{margin-top:22px;font-size:15px;color:#5b6b60;line-height:1.6;background:#fff;border-left:4px solid #215E41;padding:10px 14px;border-radius:0 8px 8px 0}
.foot{margin-top:20px;text-align:right;font-size:14.5px;color:#8a958c}
</style></head><body>
<div class="card">
  <h1>写作顺序：从结果倒着往前写</h1>
  <p class="sub">写的时候一个顺序，读的时候是另一个顺序</p>

  <div class="cols">
    <div class="col">
      <p class="ct">我实际动笔的顺序</p>
      <div class="step"><span class="n">1</span><span class="nm">结果与讨论</span></div><div class="vdown"></div>
      <div class="step"><span class="n">2</span><span class="nm">材料与方法</span></div><div class="vdown"></div>
      <div class="step"><span class="n">3</span><span class="nm">结论</span></div><div class="vdown"></div>
      <div class="step"><span class="n">4</span><span class="nm">引言</span></div><div class="vdown"></div>
      <div class="step"><span class="n">5</span><span class="nm">摘要与标题</span></div><div class="vdown"></div>
      <div class="step"><span class="n">6</span><span class="nm">参考文献</span></div>
    </div>
    <div class="col">
      <p class="ct">读者看到的顺序</p>
      <div class="rd"><b>摘要</b> → 引言 → 材料与方法 → 结果与讨论 → 结论 → 参考文献</div>
      <div class="rd" style="border-style:solid;border-color:#dbe7de;background:#F6FAF7">写作顺序几乎正好<b>倒过来</b>：摘要留到最后写</div>
      <div class="note">摘要写在最前面，约束的是一篇还不存在的论文。我第一版就是顺着写的，摘要里那句结论，第三版对完数据后被推翻重写。</div>
    </div>
  </div>

  <div class="foot">据本篇写作过程整理 · 2026-08-03</div>
</div>
</body></html>
