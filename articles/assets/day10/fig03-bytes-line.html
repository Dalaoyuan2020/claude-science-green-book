<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1000px;background:#F2F7F3;font-family:"PingFang SC",sans-serif}
.card{width:1000px;box-sizing:border-box;padding:44px 52px 26px;background:#F2F7F3}
h1{font-family:"Songti SC",serif;font-size:30px;font-weight:700;color:#215E41;margin:0 0 4px}
.sub{font-size:16px;color:#5b6b60;margin:0 0 18px}
svg{display:block}
.axis{stroke:#c4d4c9;stroke-width:1.5}
.grid{stroke:#eef4ef;stroke-width:1}
.xl{font-size:15px;fill:#5b6b60;font-family:"PingFang SC",sans-serif}
.yl{font-size:13px;fill:#8a958c;font-family:"PingFang SC",sans-serif}
.ser{font-size:14px;font-weight:700;font-family:"PingFang SC",sans-serif}
.dip{font-size:12.5px;fill:#B37400;font-weight:700;font-family:"PingFang SC",sans-serif}
.foot{margin-top:14px;text-align:right;font-size:14.5px;color:#8a958c;font-family:"PingFang SC",sans-serif}
</style></head><body>
<div class="card">
  <h1>六个版本的三维评分</h1>
  <p class="sub">字数在掉的那两轮，分数都在涨（满分 5 分）</p>

  <svg width="896" height="430" viewBox="0 0 896 430">
    <!-- y 轴 0-5 网格：y = 350 - score*56 -->
    <line class="axis" x1="80" y1="350" x2="80" y2="70"/>
    <line class="axis" x1="80" y1="350" x2="850" y2="350"/>
    <line class="grid" x1="80" y1="294" x2="850" y2="294"/>
    <line class="grid" x1="80" y1="238" x2="850" y2="238"/>
    <line class="grid" x1="80" y1="182" x2="850" y2="182"/>
    <line class="grid" x1="80" y1="126" x2="850" y2="126"/>
    <line class="grid" x1="80" y1="70"  x2="850" y2="70"/>
    <text class="yl" x="70" y="354" text-anchor="end">0</text>
    <text class="yl" x="70" y="298" text-anchor="end">1</text>
    <text class="yl" x="70" y="242" text-anchor="end">2</text>
    <text class="yl" x="70" y="186" text-anchor="end">3</text>
    <text class="yl" x="70" y="130" text-anchor="end">4</text>
    <text class="yl" x="70" y="74"  text-anchor="end">5</text>

    <!-- 横轴 v1-v6：x = 130,270,410,550,690,830 -->
    <!-- 完成度 2/3/3/4/4/5 → y=238/182/182/126/126/70 -->
    <polyline fill="none" stroke="#215E41" stroke-width="3" stroke-linejoin="round"
      points="130,238 270,182 410,182 550,126 690,126 830,70"/>
    <!-- 深度 1/2/3/3/4/4 → y=294/238/182/182/126/126 -->
    <polyline fill="none" stroke="#B37400" stroke-width="3" stroke-linejoin="round" stroke-dasharray="7,5"
      points="130,294 270,238 410,182 550,182 690,126 830,126"/>
    <!-- 可复现 1/1/3/5/5/5 → y=294/294/182/70/70/70 -->
    <polyline fill="none" stroke="#5b8a72" stroke-width="3" stroke-linejoin="round" stroke-dasharray="2,5"
      points="130,294 270,294 410,182 550,70 690,70 830,70"/>

    <!-- 数据点 -->
    <g fill="#215E41">
      <circle cx="130" cy="238" r="5"/><circle cx="270" cy="182" r="5"/><circle cx="410" cy="182" r="5"/>
      <circle cx="550" cy="126" r="5"/><circle cx="690" cy="126" r="5"/><circle cx="830" cy="70" r="5"/>
    </g>
    <g fill="#B37400">
      <circle cx="130" cy="294" r="5"/><circle cx="270" cy="238" r="5"/><circle cx="410" cy="182" r="5"/>
      <circle cx="550" cy="182" r="5"/><circle cx="690" cy="126" r="5"/><circle cx="830" cy="126" r="5"/>
    </g>
    <g fill="#5b8a72">
      <circle cx="130" cy="294" r="4"/><circle cx="270" cy="294" r="4"/><circle cx="410" cy="182" r="4"/>
      <circle cx="550" cy="70" r="5"/><circle cx="690" cy="70" r="5"/><circle cx="830" cy="70" r="5"/>
    </g>

    <!-- x 轴标签 -->
    <text class="xl" x="130" y="376" text-anchor="middle">v1</text>
    <text class="xl" x="270" y="376" text-anchor="middle">v2</text>
    <text class="xl" x="410" y="376" text-anchor="middle">v3</text>
    <text class="xl" x="550" y="376" text-anchor="middle">v4</text>
    <text class="xl" x="690" y="376" text-anchor="middle">v5</text>
    <text class="xl" x="830" y="376" text-anchor="middle">v6</text>

    <!-- v4 / v6 字数减了标注 -->
    <text class="dip" x="550" y="398" text-anchor="middle">字数减了</text>
    <text class="dip" x="830" y="398" text-anchor="middle">字数减了</text>

    <!-- 图例 -->
    <g>
      <line x1="90" y1="416" x2="120" y2="416" stroke="#215E41" stroke-width="3"/><text class="ser" x="126" y="420" fill="#215E41">完成度</text>
      <line x1="210" y1="416" x2="240" y2="416" stroke="#B37400" stroke-width="3" stroke-dasharray="7,5"/><text class="ser" x="246" y="420" fill="#B37400">深度</text>
      <line x1="310" y1="416" x2="340" y2="416" stroke="#5b8a72" stroke-width="3" stroke-dasharray="2,5"/><text class="ser" x="346" y="420" fill="#5b8a72">可复现</text>
    </g>
  </svg>

  <div class="foot">据六个版本逐版评分整理 · 2026-08-03</div>
</div>
</body></html>
