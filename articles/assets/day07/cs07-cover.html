<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1024px;height:1024px;overflow:hidden}
body{
  background:linear-gradient(165deg,#2D7D5F 0%,#1A4D3A 100%);
  font-family:"PingFang SC","Microsoft YaHei",sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  padding:80px 60px 60px;
}
.tag{
  display:inline-block;
  font-size:26px;
  font-weight:800;
  color:#1A4D3A;
  background:#B9E9CF;
  border-radius:100px;
  padding:10px 32px;
  letter-spacing:3px;
  margin-bottom:28px;
}
.title-en{
  font-size:52px;
  font-weight:700;
  color:#E8F5E9;
  letter-spacing:2px;
  margin-bottom:8px;
}
.title-cn{
  font-family:"Yuanti SC","PingFang SC",sans-serif;
  font-size:120px;
  font-weight:900;
  color:#fff;
  letter-spacing:8px;
  line-height:1.1;
  margin-bottom:20px;
}
.subtitle{
  font-size:44px;
  font-weight:700;
  color:#B9E9CF;
  letter-spacing:2px;
  margin-bottom:50px;
}
.image-frame{
  width:820px;
  height:460px;
  border-radius:24px;
  overflow:hidden;
  border:6px solid rgba(255,255,255,0.9);
  box-shadow:0 12px 40px rgba(0,0,0,0.25);
  background:#fff;
}
.image-frame img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.footer{
  margin-top:44px;
  font-size:24px;
  color:#B9E9CF;
  font-weight:600;
  letter-spacing:2px;
}
</style>
</head>
<body>
  <div class="tag">第三部 · 实战篇</div>
  <div class="title-en">Claude Science</div>
  <div class="title-cn">绿皮书</div>
  <div class="subtitle">07 · 从 Claude Science 看 Science</div>
  <div class="image-frame">
    <img src="img1-cover-illustration.png" alt="科研思维实战">
  </div>
  <div class="footer">@河小驴 · 边做边写</div>
</body>
</html>
